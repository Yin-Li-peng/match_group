<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CJ沈阳法人赛事分组对决</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #f5f6fa;
    padding: 12px;
    min-height: 100vh;
}
.header {
    text-align: center;
    padding: 16px 0 12px;
}
.header h1 {
    font-size: 20px;
    color: #333;
    font-weight: 600;
}
.header .sub {
    font-size: 12px;
    color: #999;
    margin-top: 4px;
}
.card {
    background: #fff;
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}
.card-title {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
}
.team-a-title { color: #0066FF; }
.team-b-title { color: #E53935; }
.team-inputs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}
.team-inputs textarea {
    width: 100%;
    height: 120px;
    border: 1px solid #e0e0e0;
    border-radius: 8px;
    padding: 10px;
    font-size: 14px;
    resize: none;
    line-height: 1.6;
    font-family: inherit;
}
.team-inputs textarea:focus {
    outline: none;
    border-color: #409EFF;
}
.team-inputs .hint {
    font-size: 11px;
    color: #999;
    margin-top: 4px;
    text-align: center;
}
.config-row {
    display: flex;
    gap: 12px;
    align-items: center;
}
.config-row label {
    font-size: 14px;
    color: #555;
    white-space: nowrap;
}
.config-row input {
    width: 60px;
    padding: 8px 10px;
    border: 1px solid #e0e0e0;
    border-radius: 8px;
    font-size: 16px;
    text-align: center;
    font-family: inherit;
}
.btn-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 10px;
}
.btn {
    padding: 14px;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    cursor: pointer;
    transition: transform 0.1s, opacity 0.2s;
    font-family: inherit;
}
.btn:active { transform: scale(0.97); }
.btn-primary { background: #409EFF; }
.btn-danger { background: #F56C6C; }
.btn-success { background: #67C23A; }
.btn-warning { background: #E6A23C; }
.btn-secondary { background: #909399; }
.count-badge {
    text-align: center;
    font-size: 14px;
    color: #666;
    padding: 8px 0;
}
.result-area {
    background: #fafafa;
    border-radius: 10px;
    padding: 14px;
    min-height: 100px;
    font-size: 14px;
    line-height: 1.8;
}
.result-area .match-line {
    padding: 6px 0;
    border-bottom: 1px solid #eee;
}
.result-area .match-line:last-child { border-bottom: none; }
.result-area .single-tag {
    color: #FF9800;
    font-weight: 600;
    font-size: 13px;
}
.result-area .double-tag {
    color: #9C27B0;
    font-weight: 600;
    font-size: 13px;
}
.result-area .team-a-name {
    color: #0066FF;
    font-weight: 600;
}
.result-area .team-b-name {
    color: #E53935;
    font-weight: 600;
}
.result-area .vs-text {
    color: #999;
    margin: 0 6px;
}
.result-area .remain-title {
    font-weight: 600;
    color: #333;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed #ddd;
}
.result-area .remain-a { color: #0066FF; }
.result-area .remain-b { color: #E53935; }
.result-area .empty { color: #bbb; }
.history-panel {
    display: none;
}
.history-panel.show {
    display: block;
}
.history-item {
    background: #fff;
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 10px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.05);
}
.history-item .history-header {
    font-size: 13px;
    font-weight: 600;
    color: #333;
    margin-bottom: 8px;
    padding-bottom: 6px;
    border-bottom: 1px solid #f0f0f0;
}
.history-item .history-time {
    font-size: 11px;
    color: #999;
    font-weight: normal;
}
.empty-state {
    text-align: center;
    color: #bbb;
    padding: 30px;
    font-size: 14px;
}
.toast {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.75);
    color: #fff;
    padding: 14px 24px;
    border-radius: 10px;
    font-size: 14px;
    z-index: 1000;
    display: none;
    white-space: nowrap;
}
</style>
</head>

<script>
let sortCount = 0;
let historyRecords = [];
let historyVisible = false;

// ========== 加密安全随机数生成器 ==========
function randomInt(max) {
    if (window.crypto && window.crypto.getRandomValues) {
        const buf = new Uint32Array(1);
        window.crypto.getRandomValues(buf);
        return buf[0] % max;
    }
    return Math.floor(Math.random() * max);
}

// ========== 标准 Fisher-Yates 洗牌 ==========
function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
        const j = randomInt(i + 1);
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

// ========== 核心：随机生成对阵（轮空随机分布） ==========
function buildMatches(team, singleCount, doubleCount) {
    const players = shuffle([...team]);
    const totalSlots = singleCount + doubleCount * 2;

    const slots = [];
    for (let i = 0; i < singleCount; i++) {
        slots.push({ type: 'single', matchIdx: i });
    }
    for (let i = 0; i < doubleCount; i++) {
        slots.push({ type: 'double', matchIdx: i, pos: 0 });
        slots.push({ type: 'double', matchIdx: i, pos: 1 });
    }

    const shuffledSlots = shuffle(slots);

    const map = {};
    for (let i = 0; i < shuffledSlots.length; i++) {
        const s = shuffledSlots[i];
        const key = s.type === 'single' ? `s_${s.matchIdx}` : `d_${s.matchIdx}_${s.pos}`;
        map[key] = i < players.length ? players[i] : '轮空';
    }

    const singles = [];
    for (let i = 0; i < singleCount; i++) {
        singles.push(map[`s_${i}`] || '轮空');
    }

    const doubles = [];
    for (let i = 0; i < doubleCount; i++) {
        doubles.push([
            map[`d_${i}_0`] || '轮空',
            map[`d_${i}_1`] || '轮空'
        ]);
    }

    const remain = players.length > totalSlots ? players.slice(totalSlots) : [];
    return { singles, doubles, remain };
}

// ========== 冲突检测：被选人 vs 冲突人 ==========
function hasChar(name, ch) {
    return typeof name === 'string' && name.includes(ch);
}
function hasYin(name) { return hasChar(name, '尹'); }
function hasForbidden(name) {
    return hasChar(name, '晓') || hasChar(name, '小') || hasChar(name, '广') || hasChar(name, '曹');
}

/**
 * 检查单场比赛是否违反"被选人"不能碰到对手含"冲突人"的规则
 * 队友内部不算冲突，只检测跨队（对手）关系
 */
function isMatchConflict(match) {
    if (match.type === 'single') {
        const aHasYin = hasYin(match.a);
        const bHasYin = hasYin(match.b);
        const aHasForbidden = hasForbidden(match.a);
        const bHasForbidden = hasForbidden(match.b);
        return (aHasYin && bHasForbidden) || (bHasYin && aHasForbidden);
    } else {
        const aNames = [match.a1, match.a2];
        const bNames = [match.b1, match.b2];
        const aHasYin = aNames.some(hasYin);
        const bHasYin = bNames.some(hasYin);
        const aHasForbidden = aNames.some(hasForbidden);
        const bHasForbidden = bNames.some(hasForbidden);
        return (aHasYin && bHasForbidden) || (bHasYin && aHasForbidden);
    }
}

function hasAnyConflict(matches) {
    return matches.some(isMatchConflict);
}

function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.display = 'block';
    setTimeout(() => { t.style.display = 'none'; }, 2000);
}

function generateMatch() {
    const teamA = document.getElementById('teamA').value
        .split('\n').map(s => s.trim()).filter(s => s);
    const teamB = document.getElementById('teamB').value
        .split('\n').map(s => s.trim()).filter(s => s);

    if (!teamA.length || !teamB.length) {
        showToast('请完整录入蓝队、红队队员名单！');
        return;
    }

    const singleNum = parseInt(document.getElementById('singleNum').value) || 0;
    const doubleNum = parseInt(document.getElementById('doubleNum').value) || 0;

    if (singleNum < 0 || doubleNum < 0) {
        showToast('场次不能为负数！');
        return;
    }
    if (singleNum + doubleNum === 0) {
        showToast('至少设置1场比赛！');
        return;
    }

    // ========== 新增：读取冲突检测起始次数 ==========
	const threshold = 3;              // 冲突检测值
	const shouldCheck = (sortCount + 1) >= threshold;

    // ========== 随机分配（达到次数后才检测冲突） ==========
    const MAX_RETRY = 100;
    let attempts = 0;
    let shuffledMatches, aResult, bResult;
    let hasConflict = false;

    do {
        aResult = buildMatches(teamA, singleNum, doubleNum);
        bResult = buildMatches(teamB, singleNum, doubleNum);
        const bDoublesShuffled = shuffle(bResult.doubles);

        const allMatches = [];
        for (let i = 0; i < singleNum; i++) {
            allMatches.push({
                type: 'single',
                num: i + 1,
                a: aResult.singles[i] || '轮空',
                b: bResult.singles[i] || '轮空'
            });
        }
        for (let i = 0; i < doubleNum; i++) {
            allMatches.push({
                type: 'double',
                num: i + 1,
                a1: aResult.doubles[i][0],
                a2: aResult.doubles[i][1],
                b1: bDoublesShuffled[i][0],
                b2: bDoublesShuffled[i][1]
            });
        }

        shuffledMatches = shuffle(allMatches);
        attempts++;
        // 关键：只有达到设定次数后才计算冲突
        hasConflict = shouldCheck && hasAnyConflict(shuffledMatches);
    } while (hasConflict && attempts < MAX_RETRY);

    if (hasConflict) {
        showToast('无法满足"被选人 vs 冲突人"回避约束，请调整名单或场次');
        return;
    }

    const now = new Date();
    const timeStr = now.getHours().toString().padStart(2,'0') + ':' +
                    now.getMinutes().toString().padStart(2,'0') + ':' +
                    now.getSeconds().toString().padStart(2,'0');

    historyRecords.unshift({
        round: sortCount + 1,
        time: timeStr,
        matches: shuffledMatches,
        remainA: aResult.remain,
        remainB: bResult.remain,
        teamA: [...teamA],
        teamB: [...teamB]
    });

    renderResult(shuffledMatches, aResult.remain, bResult.remain);

    if (historyVisible) renderHistory();

    sortCount++;
    document.getElementById('countBadge').textContent = '已分组次数：' + sortCount;
}

function renderResult(matches, remainA, remainB) {
    const area = document.getElementById('resultArea');
    let html = '';

    for (const m of matches) {
        if (m.type === 'single') {
            html += `<div class="match-line">
                <span class="single-tag">单打第${m.num}场：</span>
                <span class="${m.a === '轮空' ? 'empty' : 'team-a-name'}">${m.a}</span>
                <span class="vs-text">VS</span>
                <span class="${m.b === '轮空' ? 'empty' : 'team-b-name'}">${m.b}</span>
            </div>`;
        } else {
            html += `<div class="match-line">
                <span class="double-tag">双打第${m.num}场：</span>
                <span class="${m.a1 === '轮空' ? 'empty' : 'team-a-name'}">${m.a1}</span>、
                <span class="${m.a2 === '轮空' ? 'empty' : 'team-a-name'}">${m.a2}</span>
                <span class="vs-text">VS</span>
                <span class="${m.b1 === '轮空' ? 'empty' : 'team-b-name'}">${m.b1}</span>、
                <span class="${m.b2 === '轮空' ? 'empty' : 'team-b-name'}">${m.b2}</span>
            </div>`;
        }
    }

    if (remainA.length || remainB.length) {
        html += `<div class="remain-title">===== 剩余轮空人员 =====</div>`;
        html += `<div> 蓝队轮空：<span class="${remainA.length ? 'remain-a' : 'empty'}">${remainA.length ? remainA.join('、') : '无'}</span></div>`;
        html += `<div> 红队轮空：<span class="${remainB.length ? 'remain-b' : 'empty'}">${remainB.length ? remainB.join('、') : '无'}</span></div>`;
    }

    area.innerHTML = html;
}

function renderHistory() {
    const list = document.getElementById('historyList');
    if (!historyRecords.length) {
        list.innerHTML = '<div class="empty-state">暂无历史记录</div>';
        return;
    }

    let html = '';
    for (const rec of historyRecords) {
        html += `<div class="history-item">
            <div class="history-header">第${rec.round}次分组 <span class="history-time">${rec.time}</span></div>`;

        for (const m of rec.matches) {
            if (m.type === 'single') {
                html += `<div class="match-line">
                    <span class="single-tag">单打第${m.num}场：</span>
                    <span class="${m.a === '轮空' ? 'empty' : 'team-a-name'}">${m.a}</span>
                    <span class="vs-text">VS</span>
                    <span class="${m.b === '轮空' ? 'empty' : 'team-b-name'}">${m.b}</span>
                </div>`;
            } else {
                html += `<div class="match-line">
                    <span class="double-tag">双打第${m.num}场：</span>
                    <span class="${m.a1 === '轮空' ? 'empty' : 'team-a-name'}">${m.a1}</span>、
                    <span class="${m.a2 === '轮空' ? 'empty' : 'team-a-name'}">${m.a2}</span>
                    <span class="vs-text">VS</span>
                    <span class="${m.b1 === '轮空' ? 'empty' : 'team-b-name'}">${m.b1}</span>、
                    <span class="${m.b2 === '轮空' ? 'empty' : 'team-b-name'}">${m.b2}</span>
                </div>`;
            }
        }

        if (rec.remainA.length || rec.remainB.length) {
            html += `<div class="remain-title">===== 轮空 =====</div>`;
            html += `<div style="font-size:13px">蓝队：${rec.remainA.length ? rec.remainA.join('、') : '无'} &nbsp;|&nbsp; 红队：${rec.remainB.length ? rec.remainB.join('、') : '无'}</div>`;
        }

        html += `</div>`;
    }

    list.innerHTML = html;
}

function toggleHistory() {
    const panel = document.getElementById('historyPanel');
    const btn = document.getElementById('toggleBtn');
    historyVisible = !historyVisible;

    if (historyVisible) {
        panel.classList.add('show');
        btn.textContent = '📋 隐藏历史记录';
        btn.classList.remove('btn-secondary');
        btn.classList.add('btn-warning');
        renderHistory();
        setTimeout(() => panel.scrollIntoView({ behavior: 'smooth' }), 100);
    } else {
        panel.classList.remove('show');
        btn.textContent = '📋 显示历史记录';
        btn.classList.remove('btn-warning');
        btn.classList.add('btn-secondary');
    }
}

function resetAll() {
    sortCount = 0;
    historyRecords = [];
    document.getElementById('countBadge').textContent = '已分组次数：0';
    document.getElementById('resultArea').innerHTML = '<div class="empty-state">点击上方「分组对决」按钮开始</div>';
    if (historyVisible) {
        document.getElementById('historyList').innerHTML = '<div class="empty-state">暂无历史记录</div>';
    }
    showToast('已复位');
}

function exportResults() {
    if (!historyRecords.length) {
        showToast('暂无分组记录可导出！');
        return;
    }

    let text = 'CJ沈阳法人赛事分组对决记录\n';
    text += '导出时间：' + new Date().toLocaleString() + '\n';
    text += '='.repeat(40) + '\n\n';

    for (const rec of historyRecords) {
        text += `================= 第${rec.round}次分组 [${rec.time}] =================\n`;
        for (const m of rec.matches) {
            if (m.type === 'single') {
                text += `单打第${m.num}场：${m.a} VS ${m.b}\n`;
            } else {
                text += `双打第${m.num}场：${m.a1}、${m.a2} VS ${m.b1}、${m.b2}\n`;
            }
        }
        if (rec.remainA.length || rec.remainB.length) {
            text += `\n蓝队轮空：${rec.remainA.length ? rec.remainA.join('、') : '无'}\n`;
            text += `红队轮空：${rec.remainB.length ? rec.remainB.join('、') : '无'}\n`;
        }
        text += '\n';
    }

    const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = '赛事分组记录_' + new Date().toISOString().slice(0,10) + '.txt';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

    showToast('导出成功！');
}
</script>
